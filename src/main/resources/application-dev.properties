# Configuration pour l'environnement de développement local
# Ce profil est utilisé lors du développement en local

# Configuration CORS pour développement local - Désactivé
cors.allowed-origins=

# Cookie JWT sans flag Secure en local (HTTP)
app.cookie.secure=false

# Logs plus verbeux en développement
logging.level.ma.org.anp.gestiontarif=DEBUG
logging.level.org.springframework.security=DEBUG
