# Configuration du serveur
server.port=8080
server.servlet.context-path=/echanges-web-backend

# Configuration de l'application
spring.application.name=echanges-web-backend
spring.datasource.jndi-name=java:/jdbc/eEscale
# Configuration LDAP/Active Directory
# LDAPS (TLS port 636) — le certificat du serveur LDAP doit être dans le truststore JVM
# Si certificat auto-signé : ajouter -Djavax.net.ssl.trustStore=... au démarrage
ldap.url=${LDAP_URL}
ldap.base=${LDAP_BASE}
ldap.username=${LDAP_USER}
ldap.password=${LDAP_PASSWORD}

# Clé de chiffrement AES-256 pour mfa_secret (base64, 32 octets)
# Générer : openssl rand -base64 32
mfa.encryption.key=${MFA_ENCRYPTION_KEY}

# Configuration JWT
jwt.secret=${JWT_SECRET}
#15 minutes
jwt.expiration=900000

# Cookie JWT — true en production (HTTPS), false en développement local (HTTP)
app.cookie.secure=true

# Configuration CORS
# Les origines autorisées sont définies dans les fichiers de profils (application-{profile}.properties)
# CORS désactivés pour tous les profils
cors.allowed-origins=

# Profil actif - Changer selon l'environnement :
# - dev : développement local (localhost)
# - test : serveur de test (apptest.anp.ma - HTTP et HTTPS)
# - prod : serveur de production (HTTPS uniquement)
spring.profiles.active=prod

# Configuration Logging
# Niveaux de logs
logging.level.root=INFO
logging.level.ma.org.anp=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=WARN
logging.level.org.springframework.ldap=INFO

# Configuration des fichiers de logs (utilisés par logback-spring.xml)
# Répertoire des fichiers de logs — surchargeable via la variable d'env LOG_PATH
# Prod Linux : export LOG_PATH=/var/log/webedi
# Dev Windows : LOG_PATH=c:/LOG_console/webservices/web  (valeur par défaut)
app.logging.path=${LOG_PATH_WEB:c:/LOG_console/webservices/web}
# Nom du fichier de log (sans extension)
app.logging.file-name=echanges-web-backend
# Taille maximale par fichier avant rotation
app.logging.max-file-size=10MB
# Nombre de jours de conservation des logs
app.logging.max-history=30
# Taille totale maximale des archives
app.logging.total-size-cap=1GB

# Configuration SpringDoc OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true

# Configuration de l'encodage
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true
spring.jpa.properties.javax.persistence.validation.mode=none

# Configuration des messages d'erreur (stack traces activées hors prod, désactivées via application-prod.properties)
server.error.include-stacktrace=ON_PARAM
server.error.include-exception=true
# Logs Hibernate (à désactiver en production)
#logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
#spring.jpa.properties.hibernate.format_sql=true
#spring.jpa.properties.hibernate.use_sql_comments=true

spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=UTC
spring.jpa.properties.hibernate.jdbc.time_zone=UTC