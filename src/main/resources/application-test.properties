# Configuration pour l'environnement de test
# Ce profil est utilisé sur le serveur de test (apptest.anp.ma)

# Configuration CORS pour serveur de test
#cors.allowed-origins=http://localhost:4200,http://172.16.114.143:4200,http://172.16.114.143,http://adminconsole:8080,http://localhost:8080
cors.allowed-origins=${WEB_ALLOWED_ORIGINS}
# Logs modérés en test
logging.level.ma.org.anp.gestiontarif=INFO
logging.level.org.springframework.security=INFO

app.csp=default-src 'self'; \
script-src 'self'; \
style-src 'self' 'unsafe-inline'; \
img-src 'self' data:    http://localhost:8080 ; \
font-src 'self' data:   http://localhost:8080 http://172.16.114.143; \
connect-src 'self' \
    http://localhost:8080 \
    http://localhost:4200 ; \
frame-ancestors 'none'; \
base-uri 'self';