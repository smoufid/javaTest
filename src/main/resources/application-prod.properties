# Configuration pour l'environnement de production
# Ce profil est utilisé sur le serveur de production

# ── CORS : origines autorisées explicitement (jamais de wildcard en prod)
cors.allowed-origins=${WEB_ALLOWED_ORIGINS}

# ── Logs minimaux en production
logging.level.ma.org.anp=WARN
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN

# ── Masquer les erreurs techniques dans les réponses HTTP
server.error.include-stacktrace=never
server.error.include-exception=false

# ── Désactiver Swagger/OpenAPI en production
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

